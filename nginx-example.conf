# Noyob Innovative: nginx example (adapt paths and certificates to your server)
server {
    listen 80;
    server_name noyobinnovative.in www.noyobinnovative.in;
    return 301 https://noyobinnovative.in$request_uri;
}
server {
    listen 443 ssl;
    server_name www.noyobinnovative.in;
    # ssl_certificate ...; ssl_certificate_key ...;
    return 301 https://noyobinnovative.in$request_uri;
}
server {
    listen 443 ssl;
    server_name noyobinnovative.in;
    root /var/www/noyobinnovative;
    index index.html;
    # ssl_certificate ...; ssl_certificate_key ...;

    rewrite ^/index\.html$ / permanent;
    rewrite ^/insights\.html$ /blog.html permanent;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
